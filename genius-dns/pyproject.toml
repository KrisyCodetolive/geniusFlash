[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geniusdns"
version = "0.1.0"
description = "Registre DNS local signé et agent qui synchronise le fichier hosts"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geniusdns-registry = "geniusdns.registry.cli:main"
geniusdns-agent = "geniusdns.agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
